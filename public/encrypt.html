<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guest Name Encryptor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    body {
      font-family: "Khmer OS Battambang", sans-serif;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
    }
    input {
      padding: 10px 15px;
      width: 300px;
      font-size: 18px;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 6px;
    }
    textarea {
      width: 80%;
      height: 100px;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>🔒 Encrypt Guest Name</h2>
  <input id="guestName" placeholder="Enter guest name (e.g. វត្តី & នារា)" />
  <button onclick="encrypt()">Encrypt</button>
  <textarea id="output" readonly placeholder="Encrypted code or link will appear here..."></textarea>

  <script>
    const secretKey = "NochTeyEngagement_ILoveYouToTheMoonAndBack"

    function encrypt() {
      const name = document.getElementById("guestName").value.trim();
      if (!name) {
        alert("Please enter a guest name!");
        return;
      }

      const encrypted = CryptoJS.AES.encrypt(name, secretKey).toString();
      const link = `https://sovatey.github.io/engagement/?code=${encodeURIComponent(encrypted)}`;
      
      document.getElementById("output").value =
        `Encrypted code:\n${encrypted}\n\nInvitation link:\n${link}`;
    }
  </script>
</body>
</html>
